name: PostgreSQL tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pgtest
          POSTGRES_DB: iwiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iwiki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IWIKI_TEST_POSTGRES_DSN: postgresql://postgres:pgtest@127.0.0.1:5432/iwiki_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Rollback tests archive the pinned pre-migration source commit.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.8.13
          uv sync --frozen --extra dev
      - name: Enable pgvector in disposable database
        run: |
          uv run --frozen python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ['IWIKI_TEST_POSTGRES_DSN'], autocommit=True) as conn:
              conn.execute('CREATE EXTENSION IF NOT EXISTS vector')
          PY
      - name: Test report gate
        run: uv run --frozen pytest -q tests/test_postgres_ci_report.py
      - name: Run PostgreSQL suite
        run: uv run --frozen pytest -q -ra tests/postgres --junitxml=reports/postgres.xml
      - name: Require executed coverage without skips
        if: always()
        run: python scripts/check_postgres_junit.py reports/postgres.xml
      - name: Upload PostgreSQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-junit
          path: reports/postgres.xml
          if-no-files-found: error
