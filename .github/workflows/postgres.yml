name: PostgreSQL tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection:
    name: Select PostgreSQL coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_postgres: ${{ steps.scope.outputs.run_postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test change selection
        run: python -m unittest discover -s tests/ci -p test_postgres_selection.py
      - name: Select database coverage
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/select_postgres_ci.py

  database:
    name: PostgreSQL suite
    needs: selection
    if: needs.selection.outputs.run_postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pgtest
          POSTGRES_DB: iwiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iwiki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IWIKI_TEST_POSTGRES_DSN: postgresql://postgres:pgtest@127.0.0.1:5432/iwiki_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Rollback tests archive the pinned pre-migration source commit.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.8.13
          uv sync --frozen --extra dev
      - name: Enable pgvector in disposable database
        run: |
          uv run --frozen python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ['IWIKI_TEST_POSTGRES_DSN'], autocommit=True) as conn:
              conn.execute('CREATE EXTENSION IF NOT EXISTS vector')
          PY
      - name: Test report gate
        run: uv run --frozen pytest -q tests/test_postgres_ci_report.py
      - name: Run PostgreSQL suite
        run: uv run --frozen pytest -q -ra tests/postgres --junitxml=reports/postgres.xml
      - name: Require executed coverage without skips
        if: always()
        run: python scripts/check_postgres_junit.py reports/postgres.xml
      - name: Upload PostgreSQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-junit
          path: reports/postgres.xml
          if-no-files-found: error

  postgres:
    # Keep the existing required-check name; selection failures must not look skipped.
    name: PostgreSQL integration
    needs: [selection, database]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected coverage
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          REQUIRED: ${{ needs.selection.outputs.run_postgres }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$REQUIRED:$DATABASE_RESULT" in
            true:success) echo "PostgreSQL coverage passed; JUnit gate rejected skips." ;;
            false:skipped) echo "PostgreSQL not required for this change; no database started." ;;
            *) echo "Required PostgreSQL coverage or selection failed." >&2; exit 1 ;;
          esac
