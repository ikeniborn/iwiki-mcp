[project]
name = "iwiki-mcp"
version = "0.7.243"
description = "MCP server for a shared Git or PostgreSQL wiki split into domains"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "anyio>=4.0",
    "httpx>=0.27",
    "urllib3>=2.5,<3",
    "pathspec>=0.12",
    "filelock>=3.29",
    "numpy>=1.26",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "uvicorn>=0.30",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.13.3",
    "tomli>=2.0; python_version < '3.11'",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-typescript>=0.23.0",
]

[project.scripts]
iwiki-mcp = "iwiki_mcp.server:main"
iwiki-telegram-bot = "iwiki_mcp.telegram_bot.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "flake8>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iwiki_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres_integration: requires an explicit disposable PostgreSQL database",
    "slow: generated 20,000-file publication evidence",
    "measurement: deterministic path measurements without timing thresholds",
]
