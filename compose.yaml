services:
  iwiki:
    build: .
    network_mode: host
    # systemd owns this container's lifecycle through iwiki-mcp.service, which
    # runs `compose up` in the foreground with Restart=on-failure. A Docker
    # restart policy would fight that unit by restarting a container systemd had
    # just stopped. The database stack uses the same arrangement for the same
    # reason. Recovery from an unhealthy-but-running container comes from
    # iwiki-mcp-watchdog.timer, since Docker applies no policy to health status.
    restart: "no"
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /run:uid=10001,gid=10001,mode=0750
      - /tmp:uid=10001,gid=10001,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${IWIKI_RUNTIME_ENV_FILE:-/opt/iwiki-mcp/runtime.env}
    environment:
      IWIKI_SERVER_CONFIG: /etc/iwiki/server.toml
    volumes:
      - ${IWIKI_SERVER_CONFIG_FILE:-/opt/iwiki-mcp/server.toml}:/etc/iwiki/server.toml:ro
      - ${IWIKI_NGINX_CONFIG_FILE:-/opt/iwiki-mcp/nginx.conf}:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "/app/deploy/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 60s
