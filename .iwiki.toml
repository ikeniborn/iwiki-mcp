read = ["aioperator", "codex", "confluence", "devops", "familybudget", "familyTraffic", "framework", "iclaude", "icodex", "iwiki-mcp", "minipc", "obsidian-ai-wiki", "okf", "personal-ai-wiki", "portfolio-google", "rub-health", "snxui", "vision"]
write = ["aioperator", "codex", "confluence", "devops", "familybudget", "familyTraffic", "framework", "iclaude", "icodex", "iwiki-mcp", "minipc", "obsidian-ai-wiki", "okf", "personal-ai-wiki", "portfolio-google", "rub-health", "snxui", "vision"]
primary = "iwiki-mcp"

# GWT specification policy for every visible local domain.
# Choose one value:
# - "disabled": keep specification pages as ordinary Markdown; semantic tools are off.
# - "optional": report advisory findings and project only valid scenarios (recommended).
# - "strict": reject invalid specification mutations atomically.
# Ordinary Wiki pages work in every mode and never require the code graph.
[specifications]
mode = "strict"

[code_graph]
enabled = true
languages = ["python"]
auto_rebuild = "bounded"
# Query-time budget: how long a search on a dirty graph waits for the rebuild
# it triggers. Kept short so a stale graph slows one query rather than blocking
# it -- the caller gets a job descriptor and can poll instead.
max_rebuild_seconds = 15
# Explicit wiki_code_index budget. A full rebuild of this repository measures
# around 75 s, so this leaves room for a cold parse plus publication.
max_full_rebuild_seconds = 300
max_file_bytes = 1000000
max_total_files = 20000
include_tests = false
exclude = [
  "tests/fixtures/",
  "build/",
  "*.generated.py",
  "vendor/",
  ".claude/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".superpowers/",
  ".venv/"
]
publish_mode = "mcp" 
read_mode = "mcp"  
max_snapshot_age_seconds = 86400
max_batch_rows = 5000
max_batch_bytes = 1000000
publication_session_ttl_seconds = 1800
staging_retention_seconds = 86400
staging_cleanup_limit = 100
